<!DOCTYPE html>
<html lang="en">
<head>
  <title>Salon Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1>✂️ Salon Booking</h1>
  <p>Book premium salons near you</p>
</header>

<div class="container">

  <div class="card">
    <div class="card-top">
      <h3>Boss Salon</h3>
      <span class="rating">⭐ 4.8</span>
    </div>
    <p>Haircut • Shave • Facial</p>
    <div class="card-bottom">
      <span class="price">₹199 onwards</span>
      <a href="booking.html" class="btn">Book Now</a>
    </div>
  </div>

  <div class="card">
    <div class="card-top">
      <h3>Style King</h3>
      <span class="rating">⭐ 4.6</span>
    </div>
    <p>Haircut • Beard • Spa</p>
    <div class="card-bottom">
      <span class="price">₹249 onwards</span>
      <a href="booking.html" class="btn">Book Now</a>
    </div>
  </div>

</div>

</body>
</html>
